<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var currentFetch = window.fetch ? window.fetch.bind(window) : undefined;
          var makeWritableFetch = function (target) {
            if (!target) return;
            var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
            if (!desc || desc.configurable !== false) {
              Object.defineProperty(target, 'fetch', {
                configurable: true,
                enumerable: true,
                get: function () {
                  return currentFetch;
                },
                set: function (val) {
                  if (typeof val === 'function') {
                    currentFetch = val;
                  }
                }
              });
            }
          };
          makeWritableFetch(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            makeWritableFetch(Window.prototype);
          }
        } catch (_e) {}

        window.addEventListener(
          'error',
          function (event) {
            var msg = (event && event.message) || '';
            var file = (event && event.filename) || '';
            if (
              msg.indexOf('Cannot set property fetch') !== -1 ||
              file.indexOf('chrome-extension://') === 0
            ) {
              event.stopImmediatePropagation();
              event.preventDefault();
              return false;
            }
          },
          true
        );
      })();
    </script>
